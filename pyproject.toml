[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hope-tensorflow"
version = "0.0.1"
description = "A TensorFlow / Keras implementation of HOPE from 'Nested Learning: The Illusion of Deep Learning Architectures' (Behrouz et al., NeurIPS 2025)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "rlaope" }]
keywords = ["hope", "nested-learning", "continual-learning", "tensorflow", "keras"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tensorflow>=2.15",
    "numpy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "black>=24",
    "jupyter",
    "nbconvert",
]

[project.urls]
Homepage = "https://github.com/rlaope/HOPE-tensorflow"
Repository = "https://github.com/rlaope/HOPE-tensorflow"
Paper = "https://arxiv.org/abs/2512.24695"

[tool.setuptools.packages.find]
include = ["hope*"]
exclude = ["tests*", "notebooks*", "scripts*", "papers*", "assets*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
